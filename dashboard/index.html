<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet Sensing Urban Intel — Pune Mobility GIS Command Center</title>
<meta name="theme-color" content="#0E1B2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Fleet%20Sensing%20Urban%20Intel%22%2C%22short_name%22%3A%22FleetSensing%22%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230E1B2C%22%2C%22theme_color%22%3A%22%230E1B2C%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<!-- Leaflet GIS Engine -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<style>
/* ============ TOKENS ============ */
:root {
  --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --ink: #101826;
  --ink-soft: #5B6472;
  --ink-faint: #8A93A3;
  --surface: #FFFFFF;
  --surface-sunken: #F3F5F9;
  --surface-raised: #FFFFFF;
  --border: #E1E5EC;
  --border-soft: #EDF0F4;

  --navy: #0E1B2C;
  --navy-soft: #16283F;
  --navy-line: #24384F;

  --teal: #1C6E8C;
  --teal-ink: #0F4A61;
  --teal-soft: #E3F0F4;

  --amber: #CC7A2E;
  --amber-soft: #FBEEDD;

  --green: #2E7D53;
  --green-soft: #E3F3E9;

  --red: #B94A3B;
  --red-soft: #F8E5E2;

  --shadow-sm: 0 1px 3px rgba(16, 24, 38, 0.06);
  --shadow-md: 0 6px 20px rgba(16, 24, 38, 0.08);
  --radius: 10px;
  --radius-sm: 6px;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #EDEFF3; --ink-soft: #AEB6C4; --ink-faint: #7A8497;
    --surface: #141B27; --surface-sunken: #0F1622; --surface-raised: #1A2331;
    --border: #263042; --border-soft: #1E2735;
    --teal-soft: #173038; --amber-soft: #2E2416; --green-soft: #16281E; --red-soft: #2C1B18;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --ink: #EDEFF3; --ink-soft: #AEB6C4; --ink-faint: #7A8497;
  --surface: #141B27; --surface-sunken: #0F1622; --surface-raised: #1A2331;
  --border: #263042; --border-soft: #1E2735;
  --teal-soft: #173038; --amber-soft: #2E2416; --green-soft: #16281E; --red-soft: #2C1B18;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--surface-sunken);
  color: var(--ink);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* ============ APP SHELL ============ */
.app { display: flex; min-height: 100%; }

/* ---- Sidebar ---- */
.sidebar {
  width: 240px; min-width: 240px;
  background: var(--navy);
  color: #DDE4EE;
  display: flex; flex-direction: column;
  padding: 18px 12px calc(16px + env(safe-area-inset-bottom, 0px));
  position: sticky; top: 0; align-self: flex-start; height: 100vh;
  z-index: 40;
  transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.22s cubic-bezier(0.4, 0, 0.2, 1), padding 0.22s ease;
}
.sidebar.collapsed {
  width: 68px; min-width: 68px;
  padding: 18px 8px calc(16px + env(safe-area-inset-bottom, 0px));
}
.brand { display: flex; align-items: center; gap: 11px; padding: 6px 10px 20px; border-bottom: 1px solid var(--navy-line); }
.sidebar.collapsed .brand { justify-content: center; padding: 6px 0 16px; }
.brand-mark {
  width: 36px; height: 36px; border-radius: 9px;
  background: linear-gradient(155deg, var(--teal), #123246);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: #E3F0F4;
  cursor: pointer;
}
.brand-mark svg { width: 20px; height: 20px; }
.brand-text .t1 { font-family: var(--font-display); font-weight: 700; font-size: 14.5px; line-height: 1.15; color: #F3F6FA; }
.brand-text .t2 { font-size: 10.5px; color: #8FA0B8; letter-spacing: .02em; margin-top: 2px; }
.sidebar.collapsed .brand-text { display: none; }
.sidebar-collapse-btn {
  margin-left: auto; background: transparent; color: #8FA0B8; border-radius: 6px;
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: 1px solid transparent; transition: all 0.15s ease;
}
.sidebar-collapse-btn:hover { background: var(--navy-soft); color: #fff; border-color: var(--navy-line); }
.sidebar.collapsed .sidebar-collapse-btn { display: none; }

.nav { display: flex; flex-direction: column; gap: 3px; margin-top: 14px; flex: 1; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: 8px;
  color: #B7C2D2; background: transparent; border: none; width: 100%; text-align: left;
  font-size: 13.5px; font-weight: 500;
  transition: background .15s ease, color .15s ease;
  position: relative;
}
.sidebar.collapsed .nav-item { justify-content: center; padding: 10px 0; gap: 0; }
.sidebar.collapsed .nav-item span { display: none; }
.sidebar.collapsed .nav-item .cnt { display: none; }
.nav-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .9; }
.nav-item:hover { background: var(--navy-soft); color: #F0F3F8; }
.nav-item.active { background: var(--teal); color: #fff; }
.nav-item .cnt {
  margin-left: auto; font-size: 10.5px; font-family: var(--font-mono);
  background: rgba(255, 255, 255, 0.14); padding: 1px 7px; border-radius: 999px; color: #EAF0F6;
}
.nav-item.active .cnt { background: rgba(255, 255, 255, 0.28); }

.sidebar-foot {
  margin-top: 10px; padding: 12px 12px 4px; border-top: 1px solid var(--navy-line);
  font-size: 11px; color: #7488A0; line-height: 1.5;
}
.sidebar-foot b { color: #B7C2D2; }
.sidebar.collapsed .sidebar-foot { display: none; }

/* ---- Main column ---- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ---- Topbar ---- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 24px; display: flex; align-items: center; gap: 16px;
}
.topbar h1 { font-family: var(--font-display); font-size: 17.5px; font-weight: 700; white-space: nowrap; }
.topbar .sub { font-size: 11.5px; color: var(--ink-faint); margin-top: 1px; white-space: nowrap; }
.search {
  flex: 1; max-width: 360px; display: flex; align-items: center; gap: 8px;
  background: var(--surface-sunken); border: 1px solid var(--border); border-radius: 999px;
  padding: 7px 14px; color: var(--ink-faint); font-size: 12.5px;
}
.search input { border: none; background: transparent; color: var(--ink); width: 100%; outline: none; font-size: 12px; }
.search svg { width: 14px; height: 14px; flex-shrink: 0; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.datasource {
  display: flex; align-items: center; gap: 7px;
  border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px 6px 10px;
  font-size: 11.5px; font-weight: 600; background: var(--surface-sunken); position: relative;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.dot.pulse { box-shadow: 0 0 0 0 rgba(46, 125, 83, .5); animation: pulse 2s infinite; }
.dot.offline { background: var(--amber); }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(46, 125, 83, .45); }
  70% { box-shadow: 0 0 0 7px rgba(46, 125, 83, 0); }
  100% { box-shadow: 0 0 0 0 rgba(46, 125, 83, 0); }
}
.clock { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
.iconbtn {
  width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); display: flex; align-items: center; justify-content: center; position: relative;
}
.iconbtn svg { width: 16px; height: 16px; color: var(--ink-soft); }

/* ---- Content ---- */
.content { padding: 20px 24px 48px; max-width: 1440px; width: 100%; margin: 0 auto; }
.page-head { margin-bottom: 16px; }
.page-head h2 { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.page-head p { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; max-width: 680px; }

/* ============ COMPONENTS ============ */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow-sm);
}
.kpi .label { font-size: 11px; color: var(--ink-faint); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.kpi .value { font-family: var(--font-display); font-size: 26px; font-weight: 700; margin-top: 6px; }
.kpi .delta { font-size: 11px; margin-top: 5px; font-weight: 600; }
.kpi .delta.up { color: var(--green); } .kpi .delta.down { color: var(--amber); }

.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 18px; border-bottom: 1px solid var(--border-soft);
}
.panel-head h3 { font-family: var(--font-display); font-size: 14px; font-weight: 700; }
.panel-head .link { font-size: 11.5px; color: var(--teal); font-weight: 600; cursor: pointer; }
.panel-body { padding: 16px 18px; }

/* ============ LEAFLET GIS MAP ============ */
.map-panel { margin-bottom: 16px; }
.map-wrap {
  position: relative;
  width: 100%;
  height: 520px;
  background: var(--surface-sunken);
  overflow: hidden;
}
@media (min-height: 800px) {
  .map-wrap {
    height: calc(100vh - 340px);
    min-height: 480px;
    max-height: 680px;
  }
}
#leafletMap {
  width: 100%;
  height: 100%;
  z-index: 10;
  background: #E8ECEF;
}
:root[data-theme="dark"] #leafletMap {
  background: #111822;
}

/* Map Overlays */
.map-legend {
  position: absolute; top: 12px; right: 12px; z-index: 20;
  background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(8px);
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
  font-size: 11px; box-shadow: var(--shadow-sm); color: var(--ink);
}
:root[data-theme="dark"] .map-legend {
  background: rgba(20, 27, 39, 0.92);
}
.map-legend div { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
.map-legend span.sw { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.map-badge {
  position: absolute; bottom: 12px; left: 12px; z-index: 20;
  background: rgba(14, 27, 44, 0.88); backdrop-filter: blur(6px); color: #fff;
  font-size: 11px; padding: 6px 12px; border-radius: 999px; font-family: var(--font-mono);
  display: flex; align-items: center; gap: 8px;
}
.map-controls-bar {
  position: absolute; top: 12px; left: 60px; z-index: 20;
  display: flex; gap: 6px;
}
.map-ctl-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 10px; font-size: 11px; font-weight: 600; color: var(--ink);
  box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 5px;
}
.map-ctl-btn:hover { background: var(--surface-sunken); }

/* Custom Leaflet Map Markers */
.leaflet-bus-icon-wrap { background: transparent; border: none; }
.leaflet-bus-marker {
  position: relative; display: flex; flex-direction: column; align-items: center;
}
.bus-core {
  width: 28px; height: 28px; border-radius: 50%;
  background: #1C6E8C; color: #fff; border: 2px solid #fff;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s ease;
}
.leaflet-bus-marker.offline .bus-core { background: #64748b; }
.bus-pulse {
  position: absolute; width: 34px; height: 34px; border-radius: 50%;
  background: rgba(28, 110, 140, 0.35); top: -3px; left: -3px;
  animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
}
@keyframes pulse-ring {
  0% { transform: scale(0.8); opacity: 0.8; }
  100% { transform: scale(1.6); opacity: 0; }
}
.bus-pill-tag {
  background: var(--navy); color: #fff; font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px;
  margin-top: 2px; white-space: nowrap; border: 1px solid rgba(255, 255, 255, 0.2);
}

.leaflet-incident-icon-wrap { background: transparent; border: none; }
.leaflet-incident-marker {
  position: relative; width: 26px; height: 26px; cursor: pointer;
}
.pin-ring {
  position: absolute; inset: -4px; border-radius: 50%;
  background: var(--pin-color, #B94A3B); opacity: 0.2;
  animation: pulse-ring 2.4s infinite;
}
.pin-head {
  width: 24px; height: 24px; border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  background: var(--pin-color, #B94A3B); border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.pin-type-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #fff;
  transform: rotate(45deg);
}
.pin-verified-badge {
  position: absolute; top: -3px; right: -3px; width: 12px; height: 12px;
  background: #10b981; color: #fff; font-size: 8px; font-weight: 900;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  border: 1px solid #fff;
}

/* ============ TABLES & BADGES ============ */
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th {
  text-align: left; font-size: 10.5px; color: var(--ink-faint); font-weight: 700;
  padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
tbody td { padding: 11px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
tbody tr { transition: background .12s ease; cursor: pointer; }
tbody tr:hover { background: var(--surface-sunken); }
.mono { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); }

.badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700;
  padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.badge.sev-high { background: var(--red-soft); color: var(--red); }
.badge.sev-medium { background: var(--amber-soft); color: var(--amber); }
.badge.sev-low { background: var(--green-soft); color: var(--green); }
.badge.st-reported { background: var(--amber-soft); color: var(--amber); }
.badge.st-acknowledged { background: var(--teal-soft); color: var(--teal-ink); }
.badge.st-inprogress { background: #E7E1F7; color: #5B3FA8; }
.badge.st-resolved { background: var(--green-soft); color: var(--green); }
.badge.type { background: var(--surface-sunken); color: var(--ink-soft); border: 1px solid var(--border); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
select, .btn, input[type=text] {
  font-family: inherit; font-size: 12px; border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 11px; background: var(--surface); color: var(--ink);
}
.btn { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-ink); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 11px; font-size: 11.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ============ DRAWER ============ */
.overlay {
  position: fixed; inset: 0; background: rgba(10, 16, 26, 0.45); z-index: 60;
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
}
.overlay.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100%; width: min(460px, 94vw); z-index: 61;
  background: var(--surface); box-shadow: -12px 0 30px rgba(10, 16, 26, 0.2);
  transform: translateX(100%); transition: transform .22s ease;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.open { transform: translateX(0); }
.drawer-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 10px; }
.drawer-head .x { margin-left: auto; }
.drawer-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
.drawer-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 12.5px; }
.kv dt { color: var(--ink-faint); font-weight: 600; }
.kv dd { font-weight: 600; }

/* Evidence Container & HUD */
.evidence-container {
  position: relative; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--border); background: var(--surface-sunken);
  aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
}
.evidence-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.evidence-fallback { width: 100%; height: 100%; display: block; }
.evidence-hud-overlay {
  position: absolute; bottom: 8px; left: 8px; right: 8px;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(14, 27, 44, 0.82); backdrop-filter: blur(4px);
  padding: 4px 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 10px; color: #fff;
}
.evidence-hud-conf { color: #10b981; font-weight: 700; }

.stepper { display: flex; flex-direction: column; gap: 0; margin-top: 6px; }
.step { display: flex; gap: 10px; position: relative; padding-bottom: 18px; }
.step:last-child { padding-bottom: 0; }
.step .node { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--border); background: var(--surface); flex-shrink: 0; margin-top: 1px; z-index: 1; }
.step.done .node { background: var(--teal); border-color: var(--teal); }
.step.current .node { background: #fff; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.step:not(:last-child)::before {
  content: ''; position: absolute; left: 7.5px; top: 16px; bottom: 0; width: 1.5px; background: var(--border);
}
.step.done:not(:last-child)::before { background: var(--teal); }
.step .stitle { font-size: 12.5px; font-weight: 700; }
.step .stime { font-size: 11px; color: var(--ink-faint); margin-top: 1px; }

.section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--ink-faint); margin: 16px 0 8px; letter-spacing: .03em; }
.section-title:first-child { margin-top: 0; }

/* Buses Grid */
.bus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.bus-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
.bus-card .top { display: flex; justify-content: space-between; align-items: flex-start; }
.bus-card .id { font-family: var(--font-mono); font-weight: 700; font-size: 14px; }
.bus-card .route { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
.status-pill { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; display: flex; align-items: center; gap: 5px; }
.status-pill.online { background: var(--green-soft); color: var(--green); }
.status-pill.offline { background: var(--surface-sunken); color: var(--ink-faint); border: 1px solid var(--border); }
.bus-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; font-size: 11.5px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
.bus-meta div span { display: block; color: var(--ink-faint); font-size: 10px; margin-bottom: 2px; }

/* Kanban Board */
.kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kcol-column {
  background: var(--surface-sunken); border: 1px solid var(--border-soft);
  border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column;
}
.kcol-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 10px; }
.kcol-head h4 { font-size: 12px; font-weight: 700; }
.kcol-head .n {
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint);
  background: var(--surface); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border-soft);
}
.kcol-body {
  display: flex; flex-direction: column; gap: 8px; min-height: 220px;
  border-radius: 8px; padding: 4px; transition: background-color 0.15s ease, outline 0.15s ease;
}
.kcol-body.drag-over {
  background: rgba(28, 110, 140, 0.14);
  outline: 2px dashed var(--teal);
  outline-offset: -2px;
}
.tcard {
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
  padding: 12px; box-shadow: var(--shadow-sm); cursor: grab;
  transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
  user-select: none;
}
.tcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--teal); }
.tcard:active { cursor: grabbing; }
.tcard.is-dragging { opacity: 0.35; transform: scale(0.97); }
.tcard-drag-handle {
  display: inline-flex; align-items: center; margin-right: 6px;
  color: var(--ink-faint); font-size: 12px; cursor: grab; letter-spacing: -1px;
}
.tcard .tid { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--teal-ink); }
.tcard .ttype { font-size: 12.5px; font-weight: 600; margin-top: 4px; }
.tcard .tloc { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
.tcard .tfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.tcard-actions {
  display: flex; align-items: center; gap: 6px; margin-top: 8px; padding-top: 6px;
  border-top: 1px dashed var(--border-soft); font-size: 10.5px;
}
.tcard-move-select {
  font-size: 10.5px; padding: 2px 6px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--surface-sunken); color: var(--ink);
  cursor: pointer; outline: none; margin-left: auto;
}
.sla { font-size: 10px; font-family: var(--font-mono); color: var(--ink-faint); }

/* Fusion queue */
.fusion-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; background: var(--surface); margin-bottom: 10px; }
.fusion-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.obs-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--border-soft); }
.obs-row:first-of-type { border-top: none; }
.busdot { width: 26px; height: 26px; border-radius: 50%; background: var(--teal-soft); color: var(--teal-ink); font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* Reports */
.grid-2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 14px; align-items: start; }
.bars { display: flex; align-items: flex-end; gap: 12px; height: 170px; padding-top: 10px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; border-radius: 5px 5px 0 0; background: linear-gradient(180deg, var(--teal), var(--teal-ink)); position: relative; min-height: 4px; }
.bar-col .lab { font-size: 10px; color: var(--ink-faint); text-align: center; }
.bar-col .val { font-size: 10.5px; font-weight: 700; font-family: var(--font-mono); }

.empty { text-align: center; padding: 36px 10px; color: var(--ink-faint); font-size: 12.5px; line-height: 1.5; }

@media (max-width: 960px) {
  .sidebar { display: none; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
  .kanban { grid-template-columns: 1fr 1fr; }
  .search { display: none; }
}

/* ---------- Security: Strict HTML Entity Sanitizer ---------- */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ---------- Toast Notifications System ---------- */
function showToast(title, desc, type = 'info', durationMs = 4200) {
  const container = document.getElementById('toastContainer');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;

  const icons = {
    info: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,

/* ---------- Authenticated API Fetch Interceptor ---------- */
async function authFetch(url, options = {}) {
  try {
    const res = await fetch(url, options);
    if (res.status === 401 || res.status === 403) {
      showToast('Access Restricted', `HTTP ${res.status}: Action prohibited under current credentials.`, 'error');
    }
    return res;
  } catch (err) {
    showToast('Network Error', err.message || 'Failed to reach API server', 'error');
    throw err;
  }
}

/* ---------- Haversine Distance (Meters) ---------- */
function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

// Multi-corridor Road snapping projection
function snapToRoad(lat, lon, preferredRouteId = null) {
  if (!lat || !lon) return [18.5228, 73.8415];
  let minDistanceSq = Infinity;
  let bestPoint = [lat, lon];

  // If a specific route corridor is designated (e.g. ROUTE-PUNE-FC for actual simulator buses and potholes),
  // snap strictly to that corridor so entities never drift to adjacent parallel corridors like JM Road.
  const targetCorridors = (preferredRouteId && PUNE_CORRIDORS_GEO[preferredRouteId])
    ? [PUNE_CORRIDORS_GEO[preferredRouteId]]
    : Object.values(PUNE_CORRIDORS_GEO);

  for (const corridor of targetCorridors) {
    const coords = corridor.coords;
    for (let i = 0; i < coords.length - 1; i++) {
      const p1 = coords[i];
      const p2 = coords[i + 1];

      const dx = p2[0] - p1[0];
      const dy = p2[1] - p1[1];
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) continue;

      let t = ((lat - p1[0]) * dx + (lon - p1[1]) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));

      const projLat = p1[0] + t * dx;
      const projLon = p1[1] + t * dy;
      const distSq = (lat - projLat) * (lat - projLat) + (lon - projLon) * (lon - projLon);

      if (distSq < minDistanceSq) {
        minDistanceSq = distSq;
        bestPoint = [projLat, projLon];
      }
    }
  }

  // Snap if within reasonable corridor vicinity (~350m)
  if (minDistanceSq < 0.00030) {
    return [Number(bestPoint[0].toFixed(5)), Number(bestPoint[1].toFixed(5))];
  }
  return [Number(lat.toFixed(5)), Number(lon.toFixed(5))];
}

/* ---------- Dynamic Route Loading from RFC 7946 GeoJSON ---------- */
async function loadCorridorsFromGeoJSON() {
  try {
    const res = await fetch('/api/v1/routes/geojson');
    if (!res.ok) return;
    const data = await res.json();
    if (data && Array.isArray(data.features)) {
      data.features.forEach(feat => {
        const props = feat.properties || {};
        const geom = feat.geometry || {};
        const routeId = props.route_id;
        if (routeId && geom.type === 'LineString' && Array.isArray(geom.coordinates)) {
          const latLngCoords = geom.coordinates.map(pt => [pt[1], pt[0]]);
          if (latLngCoords.length > 1) {
            PUNE_CORRIDORS_GEO[routeId] = {
              name: props.name || routeId,
              color: props.color || '#1C6E8C',
              coords: latLngCoords
            };
          }
        }
      });
      state.corridorsLoadedFromGeoJSON = true;
    }
  } catch (err) {
    console.warn('Could not load routes/geojson, utilizing static corridor coordinates:', err);
  }
}

async function triggerSimulatorScenario(scenario) {
  if (isSimulatorTriggering) return;
  isSimulatorTriggering = true;
  document.querySelectorAll('.sim-btn').forEach(btn => btn.disabled = true);

  const scenarioLabels = {
    dual_bus: '2-Bus Corroboration (FC Road)',

  };

  showToast('Simulator Active', `Executing scenario: ${scenarioLabels[scenario] || scenario}...`, 'info');

  try {
    const res = await authFetch('/api/v1/simulators/trigger', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scenario })
    });

    if (res.ok) {
      const data = await res.json();
      showToast('Scenario Completed', data.message || `${scenarioLabels[scenario] || scenario} executed successfully!`, 'success');

/* =========================================================================
   LEAFLET GIS ENGINE IMPLEMENTATION
   ========================================================================= */
let leafletMap = null;
let tileLayer = null;
let roadPolyline = null;
let corridorPolylines = {};
let busMarkers = {};
let incidentMarkers = {};

function initLeafletMap() {
  const container = document.getElementById('leafletMap');
  if (!container) return;

  // If map already initialized and attached, invalidate size and refresh markers without view reset
  if (leafletMap && leafletMap.getContainer() && container.contains(leafletMap.getContainer())) {
    leafletMap.invalidateSize();
    updateMapMarkers();
    return;
  }

  if (leafletMap) {
    try { leafletMap.remove(); } catch (e) {}
    leafletMap = null;
    busMarkers = {};
    incidentMarkers = {};
    corridorPolylines = {};
  }

  // Restore previous center and zoom so user pan/zoom is never disrupted
  const initCenter = state.mapCenter || [18.5228, 73.8420];
  const initZoom = state.mapZoom || 15;

  leafletMap = L.map('leafletMap', {
    center: initCenter,
    zoom: initZoom,
    zoomControl: true,
  });

  // Track map view changes
  leafletMap.on('moveend', () => {
    state.mapCenter = leafletMap.getCenter();
    state.mapZoom = leafletMap.getZoom();
  });

  const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);

  const tileUrl = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

  tileLayer = L.tileLayer(tileUrl, {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
  }).addTo(leafletMap);

  // Plot All Pune Road Corridors
  for (const [routeId, corridor] of Object.entries(PUNE_CORRIDORS_GEO)) {
    // 1. Casing line for contrast
    L.polyline(corridor.coords, {
      color: isDark ? '#0F4A61' : '#0E1B2C',
      weight: 8,
      opacity: 0.55,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(leafletMap);

    // 2. Active transit corridor centerline
    const poly = L.polyline(corridor.coords, {
      color: corridor.color,
      weight: 4.5,
      opacity: 0.95,
      lineCap: 'round',
      lineJoin: 'round',
    }).addTo(leafletMap);

    corridorPolylines[routeId] = poly;
  }
  roadPolyline = corridorPolylines['ROUTE-PUNE-FC'] || null;

  // Render markers
  updateMapMarkers();

  // Invalidate map size after DOM paints
  setTimeout(() => {
    if (leafletMap) leafletMap.invalidateSize();
  }, 200);
}

function updateMapTileTheme(theme) {

function focusCorridor(name) {
  if (!leafletMap) return;
  if (name === 'ALL') {
    const polys = Object.values(corridorPolylines);

      const group = L.featureGroup(polys);
      leafletMap.fitBounds(group.getBounds(), { padding: [30, 30] });

    const key = `ROUTE-PUNE-${name.toUpperCase()}`;
    if (corridorPolylines[key]) {
      leafletMap.fitBounds(corridorPolylines[key].getBounds(), { padding: [30, 30] });

  }

function mapMarkerColorHex(type) {
  const colors = {
    POTHOLE: '#B94A3B',
    GARBAGE: '#2E7D53',
    TRAFFIC_OBSTRUCTION: '#CC7A2E',
    PEDESTRIAN_RISK: '#5B3FA8'
  };

}

function updateMapMarkers() {
  if (!leafletMap) return;

  // Clear existing drift vector layers
  if (state.driftLayers && state.driftLayers.length) {
    state.driftLayers.forEach(layer => {
      try { leafletMap.removeLayer(layer); } catch (e) {}
    });
    state.driftLayers = [];
  }

  // 1. Update live bus markers & GNSS drift vectors
  state.buses.forEach(bus => {
    const rawLat = bus.latitude || 18.5204;
    const rawLon = bus.longitude || 73.8436;
    const isActualSim = bus.bus_id === 'BUS-001' || bus.bus_id === 'BUS-002';
    const busRoute = isActualSim ? 'ROUTE-PUNE-FC' : (bus.route_id || null);
    const [snappedLat, snappedLon] = snapToRoad(rawLat, rawLon, busRoute);

    // Compute GNSS satellite drift vector
    const driftM = haversineMeters(rawLat, rawLon, snappedLat, snappedLon);
    if (driftM > 4.5) {
      const driftPoly = L.polyline([[rawLat, rawLon], [snappedLat, snappedLon]], {
        color: '#E11D48',
        weight: 2,
        dashArray: '4, 4',
        opacity: 0.85
      }).addTo(leafletMap);

      const rawDot = L.circleMarker([rawLat, rawLon], {
        radius: 3.5,
        color: '#E11D48',
        fillColor: '#E11D48',
        fillOpacity: 0.9,
        weight: 1
      }).bindTooltip(`🛰️ ${escapeHtml(bus.bus_id)} GNSS Drift: ${driftM.toFixed(1)}m`, {
        direction: 'top'
      }).addTo(leafletMap);

      state.driftLayers.push(driftPoly, rawDot);
    }

    const isOnline = bus.status === 'ONLINE' || bus.status === 'online';
    const heading = bus.heading_degrees || 0;

    const busIcon = L.divIcon({
      className: 'leaflet-bus-icon-wrap',
      html: `
        <div class="leaflet-bus-marker ${isOnline ? 'online' : 'offline'}" title="${escapeHtml(bus.bus_id)} (${bus.speed_kmh || 0} km/h)">
          <div class="bus-pulse"></div>
          <div class="bus-core" style="transform: rotate(${heading}deg);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14">
              <path d="M4 6h16v10a2 2 0 01-2 2H6a2 2 0 01-2-2z"/>
              <path d="M4 12h16"/>
              <circle cx="8" cy="18.5" r="1.5" fill="currentColor"/>
              <circle cx="16" cy="18.5" r="1.5" fill="currentColor"/>
            </svg>
          </div>
          <div class="bus-pill-tag">${escapeHtml(bus.bus_id)}</div>
        </div>
      `,
      iconSize: [44, 44],
      iconAnchor: [22, 22]
    });

    if (busMarkers[bus.bus_id]) {
      busMarkers[bus.bus_id].setLatLng([snappedLat, snappedLon]);
      busMarkers[bus.bus_id].setIcon(busIcon);
    } else {
      const marker = L.marker([snappedLat, snappedLon], { icon: busIcon, zIndexOffset: 1000 });
      marker.on('click', () => openBusDrawer(bus.bus_id));
      marker.addTo(leafletMap);
      busMarkers[bus.bus_id] = marker;
    }
  });

  // 2. Update live incident markers
  state.incidents.forEach(inc => {
    const rawLat = inc.latitude || inc.road_aligned_latitude || 18.5204;
    const rawLon = inc.longitude || inc.road_aligned_longitude || 73.8436;
    const incRoute = inc.route_id || (inc.locality && inc.locality.includes('FC') ? 'ROUTE-PUNE-FC' : null) || 'ROUTE-PUNE-FC';
    const [snappedLat, snappedLon] = snapToRoad(rawLat, rawLon, incRoute);

    const type = inc.event_type || inc.type || 'POTHOLE';
    const isVerified = inc.status === 'VERIFIED' || inc.status === 'verified';
    const isSelected = inc.incident_id === state.selectedIncidentId;
    const colorHex = mapMarkerColorHex(type);

    const incIcon = L.divIcon({
      className: 'leaflet-incident-icon-wrap',
      html: `
        <div class="leaflet-incident-marker ${isSelected ? 'selected' : ''}" style="--pin-color: ${colorHex};" title="${inc.incident_id} - ${type}">
          <div class="pin-ring"></div>
          <div class="pin-head">
            <span class="pin-type-dot"></span>
          </div>
          ${isVerified ? '<span class="pin-verified-badge">✓</span>' : ''}
        </div>
      `,
      iconSize: [30, 30],
      iconAnchor: [15, 26]
    });

    if (incidentMarkers[inc.incident_id]) {
      incidentMarkers[inc.incident_id].setLatLng([snappedLat, snappedLon]);
      incidentMarkers[inc.incident_id].setIcon(incIcon);
    } else {
      const marker = L.marker([snappedLat, snappedLon], { icon: incIcon });
      marker.on('click', () => openIncidentDrawer(inc.incident_id));
      marker.addTo(leafletMap);
      incidentMarkers[inc.incident_id] = marker;
    }
  });
}

function renderStepperHTML(ticket) {
  const steps = [
    { label: 'Reported', key: 'REPORTED' },
    { label: 'Acknowledged', key: 'ACKNOWLEDGED' },
    { label: 'In Progress', key: 'IN_PROGRESS' },
    { label: 'Resolved', key: 'RESOLVED' }
  ];

  const order = ['REPORTED', 'ACKNOWLEDGED', 'IN_PROGRESS', 'RESOLVED'];
  const curIdx = order.indexOf(ticket.status || 'REPORTED');

  return `<div class="stepper">
    ${steps.map((s, i) => {
      const isDone = i <= curIdx;
      const isCurrent = i === curIdx;
      const timeStr = isDone ? fmtTime(ticket.updated_at || ticket.created_at) : 'Pending';
      return `<div class="step ${isDone ? 'done' : ''} ${isCurrent ? 'current' : ''}">
        <div class="node"></div>
        <div>
          <div class="stitle">${s.label}</div>
          <div class="stime">${timeStr}</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ============ TICKET ACTIONS (Real REST API calls) ============ */
async function advanceTicketStatus(ticketId, nextStage) {
  if (!nextStage) return;
  try {
    const res = await authFetch(`/api/v1/tickets/${encodeURIComponent(ticketId)}/status?new_status=${encodeURIComponent(nextStage)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' }
    });
    if (res.ok) {
      const data = await res.json();
      const updated = data.ticket;
      const idx = state.tickets.findIndex(t => t.ticket_id === ticketId);
      if (idx !== -1) state.tickets[idx] = updated;
      openTicketDrawer(ticketId);
      showToast('Ticket Updated', `Ticket ${ticketId} advanced to ${nextStage}`, 'success');
      if (state.route === 'tickets') renderPage();
    } else {
      const err = await res.json().catch(() => ({}));
      showToast('Update Failed', err.detail || 'Failed to update ticket status', 'error');
    }
  } catch (err) {
    console.error('Failed to advance ticket status:', err);
  }
}

async function raiseTicketForIncident(incidentId) {
  const inc = state.incidents.find(i => i.incident_id === incidentId);
  if (!inc) return;

  const now = new Date().toISOString();
  const ticketPayload = {
    ticket_id: `POT-${new Date().getFullYear()}-${incidentId.split('-').pop() || '000001'}`,
    incident_id: incidentId,
    workorder_id: `WO-${new Date().getFullYear()}-${incidentId.split('-').pop() || '000001'}`,
    event_type: inc.event_type || inc.type || 'POTHOLE',
    confidence: inc.confidence || 0.94,
    latitude: inc.latitude || 18.5204,
    longitude: inc.longitude || 73.8436,
    evidence_image: inc.evidence_image || `runtime/evidence/${inc.event_id || 'EVT-010001'}.jpg`,
    google_maps_url: gmapsLink(inc.latitude || 18.5204, inc.longitude || 73.8436),
    estimated_repair_sla_hours: 48,
    status: 'REPORTED',
    created_at: now,
    updated_at: now
  };

  try {
    const res = await authFetch('/api/v1/tickets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ticketPayload)
    });
    if (res.ok) {
      const data = await res.json();
      state.tickets.push(data.ticket);
      inc.ticket_id = data.ticket.ticket_id;
      showToast('Ticket Dispatched', `Civic workorder ${data.ticket.ticket_id} created for ${incidentId}`, 'success');
      openIncidentDrawer(incidentId);
      if (state.route === 'tickets') renderPage();
      else if (state.route === 'dashboard') updateDashboardKpis();
    } else {
      const err = await res.json().catch(() => ({}));
      showToast('Dispatch Error', err.detail || 'Failed to raise ticket', 'error');
    }
  } catch (err) {
    console.error('Failed to raise ticket:', err);
  }
}

let draggedTicketId = null;

function updateTicketFilter(key, val) {
  state.ticketFilters[key] = (val || '').trim();
  const wrap = document.getElementById('kanbanBoardWrap');
  if (wrap) wrap.innerHTML = renderKanbanColumnsHTML();
}

function resetTicketFilters() {
  state.ticketFilters = { search: '', eventType: '', priority: '', sla: '' };
  if (document.getElementById('tktFilterSearch')) document.getElementById('tktFilterSearch').value = '';
  if (document.getElementById('tktFilterType')) document.getElementById('tktFilterType').value = '';
  if (document.getElementById('tktFilterSev')) document.getElementById('tktFilterSev').value = '';
  if (document.getElementById('tktFilterSLA')) document.getElementById('tktFilterSLA').value = '';
  const wrap = document.getElementById('kanbanBoardWrap');
  if (wrap) wrap.innerHTML = renderKanbanColumnsHTML();
}

function getFilteredTickets() {
  const tf = state.ticketFilters;
  return (state.tickets || []).filter(t => {
    const q = (tf.search || '').toLowerCase();
    const matchSearch = !q ||
      (t.ticket_id && t.ticket_id.toLowerCase().includes(q)) ||
      (t.locality && t.locality.toLowerCase().includes(q)) ||
      (t.workorder_id && t.workorder_id.toLowerCase().includes(q));
    const matchType = !tf.eventType || (t.event_type || 'POTHOLE').toUpperCase() === tf.eventType.toUpperCase();
    const matchPri = !tf.priority || (t.priority || 'HIGH').toUpperCase() === tf.priority.toUpperCase();
    const matchSla = !tf.sla || (tf.sla === 'URGENT' && (t.estimated_repair_sla_hours || 48) <= 24);
    return matchSearch && matchType && matchPri && matchSla;
  });
}

function renderKanbanColumnsHTML() {
  const cols = ['REPORTED', 'ACKNOWLEDGED', 'IN_PROGRESS', 'RESOLVED'];
  const labels = { REPORTED: 'Reported', ACKNOWLEDGED: 'Acknowledged', IN_PROGRESS: 'In Progress', RESOLVED: 'Resolved' };
  const canMutate = state.currentUser && (state.currentUser.role === 'DISPATCHER' || state.currentUser.role === 'ADMIN');
  const filteredTickets = getFilteredTickets();

  return `
  <div class="kanban" id="kanbanBoard">
    ${cols.map(c => {
      const items = filteredTickets.filter(t => (t.status || 'REPORTED') === c);
      return `
      <div class="kcol-column">
        <div class="kcol-head">
          <h4>${labels[c]}</h4>
          <span class="n">${items.length}</span>
        </div>
        <div class="kcol-body" data-col="${c}"
             ondragover="${canMutate ? 'handleTicketDragOver(event)' : ''}"
             ondragenter="${canMutate ? 'handleTicketDragOver(event)' : ''}"
             ondragleave="${canMutate ? 'handleTicketDragLeave(event)' : ''}"
             ondrop="${canMutate ? `handleTicketDrop(event, '${c}')` : ''}">
          ${items.length ? items.map(t => {
            const inc = state.incidents.find(i => i.incident_id === t.incident_id);
            return `
            <div class="tcard ${!canMutate ? 'readonly' : ''}" draggable="${canMutate ? 'true' : 'false'}" id="tcard-${escapeHtml(t.ticket_id)}"
                 ondragstart="${canMutate ? `handleTicketDragStart(event, '${escapeHtml(t.ticket_id)}')` : ''}"
                 ondragend="${canMutate ? 'handleTicketDragEnd(event)' : ''}"
                 onclick="handleTicketCardClick(event, '${escapeHtml(t.ticket_id)}')">
              <div style="display:flex;align-items:center;justify-content:space-between;">
                <div class="tid" style="display:flex;align-items:center;">
                  ${canMutate ? `<span class="tcard-drag-handle" title="Drag ticket card">⋮⋮</span>` : ''}
                  ${escapeHtml(t.ticket_id)}
                </div>
                ${statusBadge(t.status || c)}
              </div>
              <div class="ttype">${escapeHtml((t.event_type || 'POTHOLE').replace('_', ' '))}</div>
              <div class="tloc">${escapeHtml(t.locality || 'Pune Municipal Corporation')}</div>
              <div class="tfoot">
                ${sevBadge(t.priority || (inc ? inc.severity : 'HIGH'))}
                <span class="sla">${escapeHtml(String(t.estimated_repair_sla_hours || 48))}h SLA</span>
              </div>
              <div class="tcard-actions" onclick="event.stopPropagation();">
                <span style="font-size:10px;color:var(--ink-faint);">Stage:</span>
                <select class="tcard-move-select" ${!canMutate ? 'disabled title="Requires Dispatcher role"' : ''}
                        onchange="moveTicketToStatus('${escapeHtml(t.ticket_id)}', this.value)">
                  ${cols.map(opt => `<option value="${opt}" ${opt === (t.status || c) ? 'selected' : ''}>${labels[opt]}</option>`).join('')}

        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function handleTicketDragStart(event, ticketId) {
  draggedTicketId = ticketId;
  event.dataTransfer.setData('text/plain', ticketId);
  event.dataTransfer.effectAllowed = 'move';
  const card = document.getElementById(`tcard-${ticketId}`);
  if (card) card.classList.add('is-dragging');
}

function handleTicketDragEnd(event) {
  if (draggedTicketId) {
    const card = document.getElementById(`tcard-${draggedTicketId}`);
    if (card) card.classList.remove('is-dragging');
  }
  document.querySelectorAll('.kcol-body').forEach(col => col.classList.remove('drag-over'));
  draggedTicketId = null;
}

function handleTicketDragOver(event) {
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  const col = event.currentTarget;
  if (!col.classList.contains('drag-over')) {
    col.classList.add('drag-over');
  }
}

function handleTicketDragLeave(event) {
  const col = event.currentTarget;
  if (!col.contains(event.relatedTarget)) {
    col.classList.remove('drag-over');
  }
}

async function handleTicketDrop(event, targetStatus) {
  event.preventDefault();
  const col = event.currentTarget;
  col.classList.remove('drag-over');

  const ticketId = event.dataTransfer.getData('text/plain') || draggedTicketId;
  if (!ticketId) return;

  await moveTicketToStatus(ticketId, targetStatus);
}

function handleTicketCardClick(event, ticketId) {
  if (event.target.tagName === 'SELECT' || event.target.tagName === 'OPTION') return;
  openTicketDrawer(ticketId);
}

async function moveTicketToStatus(ticketId, targetStatus) {
  const canMutate = state.currentUser && (state.currentUser.role === 'DISPATCHER' || state.currentUser.role === 'ADMIN');
  if (!canMutate) {
    showToast('Permission Denied', 'Modifying ticket status requires Dispatcher or Admin role', 'warning');
    return;
  }

  const ticket = (state.tickets || []).find(t => t.ticket_id === ticketId);
  if (!ticket || ticket.status === targetStatus) return;

  const prevStatus = ticket.status;
  ticket.status = targetStatus;
  ticket.updated_at = new Date().toISOString();

  // Optimistic UI update on tickets page
  if (state.route === 'tickets') {
    const wrap = document.getElementById('kanbanBoardWrap');
    if (wrap) wrap.innerHTML = renderKanbanColumnsHTML();
  }

  try {
    const resp = await authFetch(`/api/v1/tickets/${encodeURIComponent(ticketId)}/status?new_status=${encodeURIComponent(targetStatus)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' }
    });
    if (!resp.ok) {
      throw new Error(`Server returned HTTP ${resp.status}`);
    }
    const data = await resp.json();
    if (data && data.ticket) Object.assign(ticket, data.ticket);
    showToast('Ticket Updated', `Ticket ${ticketId} transitioned to ${targetStatus}`, 'success');
  } catch (err) {
    console.error('Failed to update ticket status:', err);
    ticket.status = prevStatus;
    if (state.route === 'tickets') {
      const wrap = document.getElementById('kanbanBoardWrap');
      if (wrap) wrap.innerHTML = renderKanbanColumnsHTML();
    }
    showToast('Update Failed', `Could not update ticket status: ${err.message || 'Server error'}`, 'error');
  }
}

function handleGlobalSearch(term) {
  state.searchTerm = (term || '').trim().toLowerCase();
  if (state.route === 'tickets') {
    updateTicketFilter('search', state.searchTerm);
    return;
  }
  if (state.route === 'incidents') {
    applyIncidentFilters();
    return;
  }
  if (!state.searchTerm) return;
  // If user searched for an exact incident or ticket ID, auto open drawer if matched
  const inc = state.incidents.find(i => i.incident_id.toLowerCase() === state.searchTerm);
  if (inc) {
    openIncidentDrawer(inc.incident_id);
    return;
  }
  const tkt = state.tickets.find(t => t.ticket_id.toLowerCase() === state.searchTerm);
  if (tkt) {
    openTicketDrawer(tkt.ticket_id);
    return;
  }
}

/* =========================================================================
   REAL-TIME WEBSOCKET & REST DATA PIPELINE
   ========================================================================= */
let ws = null;
let reconnectTimer = null;

function connectWebSocket() {
  if (reconnectTimer) clearTimeout(reconnectTimer);

  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${protocol}//${location.host}/ws`;

  try {
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      state.connected = true;
      updateDsIndicator(true);
      setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send('ping');
      }, 25000);
    };

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        handleWsMessage(msg);
      } catch (err) {}
    };

    ws.onclose = () => {
      state.connected = false;
      updateDsIndicator(false);
      reconnectTimer = setTimeout(connectWebSocket, 2000);
    };

    ws.onerror = () => {
      if (ws) ws.close();
    };
  } catch (e) {
    reconnectTimer = setTimeout(connectWebSocket, 2000);
  }
}

function handleWsMessage(msg) {
  if (!msg || !msg.type) return;

  switch (msg.type) {
    case 'INITIAL_STATE':
      if (msg.data) {
        if (msg.data.fleet) state.buses = msg.data.fleet;
        if (msg.data.incidents) state.incidents = msg.data.incidents;
        if (msg.data.tickets) state.tickets = msg.data.tickets;
        if (msg.data.events) state.events = msg.data.events;
        if (msg.data.stats) state.stats = msg.data.stats;
        renderNav();
        renderPage();
      }
      break;

    case 'FLEET_UPDATED':
      if (Array.isArray(msg.data)) {
        state.buses = msg.data;
        updateMapMarkers();
        if (state.route === 'buses') renderPage();
      }
      break;

    case 'EVENT_INGESTED':
      if (msg.data) {
        state.events.unshift(msg.data);
        if (state.events.length > 50) state.events.pop();
      }
      if (msg.bus) {
        const idx = state.buses.findIndex(b => b.bus_id === msg.bus.bus_id);
        if (idx !== -1) state.buses[idx] = msg.bus;
        else state.buses.push(msg.bus);
        updateMapMarkers();
      }
      if (msg.stats) state.stats = msg.stats;
      break;

    case 'INCIDENT_CREATED':
    case 'NEW_INCIDENT':
      if (msg.data) {
        const idx = state.incidents.findIndex(i => i.incident_id === msg.data.incident_id);
        if (idx === -1) state.incidents.unshift(msg.data);
        else state.incidents[idx] = msg.data;
        updateMapMarkers();
        renderNav();
        if ((msg.data.severity || '').toUpperCase() === 'HIGH') {
          showToast('High Severity Defect', `${msg.data.incident_id} detected on ${msg.data.locality || 'Pune corridor'}`, 'warning');
        }
        if (state.route === 'dashboard') {
          updateDashboardKpis();
          updateDashboardRecentTable();
        } else if (state.route === 'incidents' || state.route === 'fusion') {
          renderPage();
        }
      }
      break;

    case 'INCIDENT_UPDATED':
      if (msg.data) {
        const idx = state.incidents.findIndex(i => i.incident_id === msg.data.incident_id);
        if (idx !== -1) state.incidents[idx] = msg.data;
        else state.incidents.unshift(msg.data);
        updateMapMarkers();
        if (msg.data.status === 'VERIFIED') {
          showToast('Corroboration Verified', `Multi-bus fusion verified ${msg.data.incident_id}`, 'success');
        }
        if (state.route === 'dashboard') {
          updateDashboardKpis();
          updateDashboardRecentTable();
        } else if (state.route === 'incidents' || state.route === 'fusion') {
          renderPage();
        }
        if (state.selectedIncidentId === msg.data.incident_id && document.getElementById('drawer') && document.getElementById('drawer').classList.contains('open')) {
          openIncidentDrawer(msg.data.incident_id);
        }
      }
      break;

    case 'TICKET_CREATED':
      if (msg.data) {
        const idx = state.tickets.findIndex(t => t.ticket_id === msg.data.ticket_id);
        if (idx === -1) state.tickets.unshift(msg.data);
        else state.tickets[idx] = msg.data;
        renderNav();
        showToast('Ticket Generated', `Civic dispatch ${msg.data.ticket_id} created`, 'info');
        if (state.route === 'tickets') {
          const wrap = document.getElementById('kanbanBoardWrap');
          if (wrap) wrap.innerHTML = renderKanbanColumnsHTML();
        } else if (state.route === 'dashboard') {
          updateDashboardKpis();
        }
      }
      break;

    case 'TICKET_STATUS_UPDATED':
      if (msg.data) {
        const idx = state.tickets.findIndex(t => t.ticket_id === msg.data.ticket_id);
        if (idx !== -1) state.tickets[idx] = msg.data;
        if (msg.data.status === 'RESOLVED') {
          showToast('Defect Verified Resolved', `Workorder ${msg.data.ticket_id} lifecycle complete`, 'success');
        }
        if (state.route === 'tickets') {
          const wrap = document.getElementById('kanbanBoardWrap');
          if (wrap) wrap.innerHTML = renderKanbanColumnsHTML();
        } else if (state.route === 'dashboard') {
          updateDashboardKpis();
        }
        // If ticket drawer is currently open for this ticket, re-render drawer in place
        if (state.selectedTicketId === msg.data.ticket_id && document.getElementById('drawer') && document.getElementById('drawer').classList.contains('open')) {
          openTicketDrawer(msg.data.ticket_id);
        }
      }
      break;

    case 'STATS_UPDATED':
      if (msg.data) {
        state.stats = msg.data;
        if (state.route === 'dashboard') {
          updateDashboardKpis();
        }
      }
      break;
  }
}

// Initial REST fetch sync
async function syncInitialData() {
  try {
    // 1. Load authentic Pune transit corridor GeoJSON from backend
    await loadCorridorsFromGeoJSON();

    // 2. Fetch initial platform dataset
    const [fleetRes, incRes, tktRes, statsRes] = await Promise.all([
      authFetch('/api/v1/fleet').then(r => r.json()).catch(() => ({ fleet: [] })),
      authFetch('/api/v1/incidents').then(r => r.json()).catch(() => ({ incidents: [] })),
      authFetch('/api/v1/tickets').then(r => r.json()).catch(() => ({ tickets: [] })),
      authFetch('/api/v1/stats').then(r => r.json()).catch(() => ({}))
    ]);

    if (fleetRes && fleetRes.fleet) state.buses = fleetRes.fleet;
    if (incRes && incRes.incidents) state.incidents = incRes.incidents;
    if (tktRes && tktRes.tickets) state.tickets = tktRes.tickets;
    if (statsRes && statsRes.total_incidents !== undefined) state.stats = statsRes;

    renderNav();
    if (state.route === 'dashboard') {
      updateDashboardKpis();
      updateDashboardRecentTable();
      updateMapMarkers();
    } else {
      renderPage();
    }
  } catch (e) {
    console.warn('Initial sync error, awaiting WebSocket:', e);
  }
}

// Register service worker if available (PWA offline readiness)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// Boot application
render();
syncInitialData();
connectWebSocket();

// Periodic fallback polling every 5 seconds to guarantee state parity
setInterval(async () => {
  try {
    const [fleetRes, incRes, tktRes] = await Promise.all([
      authFetch('/api/v1/fleet').then(r => r.json()).catch(() => null),
      authFetch('/api/v1/incidents').then(r => r.json()).catch(() => null),
      authFetch('/api/v1/tickets').then(r => r.json()).catch(() => null)
    ]);
    if (fleetRes && fleetRes.fleet) {
      state.buses = fleetRes.fleet;
      updateMapMarkers();
      if (state.route === 'dashboard') updateDashboardKpis();
      else if (state.route === 'buses') renderPage();
    }
    if (incRes && incRes.incidents) {
      state.incidents = incRes.incidents;
      updateMapMarkers();
      if (state.route === 'dashboard') {
        updateDashboardKpis();
        updateDashboardRecentTable();
      } else if (state.route === 'incidents') {
        applyIncidentFilters();
      }
    }
    if (tktRes && tktRes.tickets) {
      state.tickets = tktRes.tickets;
      if (state.route === 'dashboard') {
        updateDashboardKpis();
      } else if (state.route === 'tickets' && draggedTicketId === null) {
        const wrap = document.getElementById('kanbanBoardWrap');
        if (wrap) wrap.innerHTML = renderKanbanColumnsHTML();
      }
    }
    renderNav();
  } catch (e) {}
}, 5000);
</script>
</body>
</html>
